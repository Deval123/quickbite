spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5437/quickbite-notification
    username: quickbite
    password: quickbite
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.devalere.quickbite.*"

      # ============================================
      # FLYWAY
      # ============================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes en ms

  thymeleaf:
    prefix: classpath:/templates/
    check-template-existence: false

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health, info

  # Version simplifiée pour les services qui ne font que recevoir
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/quickbite

# ============================================
# NOTIFICATION PROVIDERS (Video 13)
# ============================================
quickbite:
  notification:
    firebase:
      # En prod : chemin vers le fichier JSON de credentials
      credentials-path: classpath:firebase-credentials.json
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:test-sid}
      auth-token: ${TWILIO_AUTH_TOKEN:test-token}
      from-number: ${TWILIO_FROM_NUMBER:+33600000000}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:test-key}
      from-email: noreply@quickbite.com
